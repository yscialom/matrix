name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 — GCC 12
          - os: ubuntu-24.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
            packages: g++-12 libgtest-dev
            build_type: Debug
          - os: ubuntu-24.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
            packages: g++-12 libgtest-dev
            build_type: Release

          # Ubuntu 24.04 — GCC 13
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            packages: g++-13 libgtest-dev
            build_type: Debug
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            packages: g++-13 libgtest-dev
            build_type: Release

          # Ubuntu 24.04 — Clang 15
          - os: ubuntu-24.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
            packages: clang-15 libgtest-dev
            build_type: Debug
          - os: ubuntu-24.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
            packages: clang-15 libgtest-dev
            build_type: Release

          # Ubuntu 24.04 — Clang 17
          - os: ubuntu-24.04
            compiler: clang-17
            cc: clang-17
            cxx: clang++-17
            packages: clang-17 libgtest-dev
            build_type: Debug
          - os: ubuntu-24.04
            compiler: clang-17
            cc: clang-17
            cxx: clang++-17
            packages: clang-17 libgtest-dev
            build_type: Release

          # macOS 14 — Apple Clang
          - os: macos-14
            compiler: appleclang
            cc: clang
            cxx: clang++
            build_type: Debug
          - os: macos-14
            compiler: appleclang
            cc: clang
            cxx: clang++
            build_type: Release

          # Windows 2022 — MSVC
          - os: windows-2022
            compiler: msvc
            build_type: Debug
          - os: windows-2022
            compiler: msvc
            build_type: Release

    steps:
      - uses: actions/checkout@v7

      - name: Install compiler and GTest (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update -q && sudo apt-get install -y ccache ${{ matrix.packages }}

      - name: Install GTest (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install googletest ccache

      - name: Cache vcpkg
        if: startsWith(matrix.os, 'windows')
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_INSTALLATION_ROOT }}/installed
          key: vcpkg-gtest-x64-windows-${{ runner.os }}
          restore-keys: |
            vcpkg-gtest-x64-windows-

      - name: Install GTest (Windows)
        if: startsWith(matrix.os, 'windows')
        run: vcpkg install gtest:x64-windows
        shell: pwsh

      - name: Cache ccache
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        shell: pwsh

      - name: Build
        run: cmake --build build --parallel --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config ${{ matrix.build_type }}

  coverage:
    name: Coverage (Ubuntu / GCC-13 / Debug)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install GCC-13, GTest and lcov
        run: sudo apt-get update -q && sudo apt-get install -y g++-13 libgtest-dev lcov

      - name: Configure with coverage
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Collect coverage data
        run: |
          lcov --capture \
               --directory build \
               --output-file coverage.info \
               --gcov-tool gcov-13 \
               --ignore-errors mismatch

      - name: Filter coverage data
        run: |
          lcov --remove coverage.info \
               '*/test/*' \
               '*/_deps/*' \
               '/usr/*' \
               --output-file coverage.info \
               --gcov-tool gcov-13 \
               --ignore-errors mismatch,unused

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  sanitizers:
    name: Sanitizers (Ubuntu / Clang-17 / Debug)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Clang-17 and GTest
        run: sudo apt-get update -q && sudo apt-get install -y clang-17 libgtest-dev

      - name: Configure with sanitizers
        env:
          CC: clang-17
          CXX: clang++-17
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -DYSC_MATRIX_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --tests-regex '^matrix-test'

      - name: Run examples
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --tests-regex '^example-'

  format-check:
    name: Format Check (clang-format)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get update -q && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          clang-format --dry-run --Werror \
            $(find src test examples -name '*.hpp' -o -name '*.cpp')

  lint:
    name: Lint (clang-tidy)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install clang-tidy and GTest
        run: sudo apt-get update -q && sudo apt-get install -y clang-tidy libgtest-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DYSC_MATRIX_BUILD_EXAMPLES=ON

      - name: Run clang-tidy
        run: run-clang-tidy -p build

  consumer-test:
    name: Consumer Test (Ubuntu / GCC-13)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install GCC-13
        run: sudo apt-get update -q && sudo apt-get install -y g++-13

      - name: Create consumer project
        run: |
          mkdir consumer_test
          cat > consumer_test/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer-test CXX)

          include(FetchContent)
          FetchContent_Declare(ysc-matrix
              GIT_REPOSITORY https://github.com/yscialom/matrix.git
              GIT_TAG        ${{ github.event.pull_request.head.sha || github.sha }}
          )
          FetchContent_MakeAvailable(ysc-matrix)

          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ysc::matrix)

          enable_testing()
          add_test(NAME consumer-run COMMAND consumer)
          EOF
          cat > consumer_test/main.cpp << 'EOF'
          #include <concepts>
          #include <matrix.hpp>

          template <typename T>
          concept sized_container = requires(T t) {
              { t.size() } -> std::convertible_to<std::size_t>;
          };

          static_assert(sized_container<ysc::matrix<int, 2, 3>>);

          int main() {
              ysc::matrix<int, 2, 3> m;
              m(0, 0) = 42;
              return m(0, 0) == 42 ? 0 : 1;
          }
          EOF

      - name: Configure consumer project
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake -S consumer_test -B consumer_test/build

      - name: Build consumer project
        run: cmake --build consumer_test/build --parallel

      - name: Run consumer test
        run: ctest --test-dir consumer_test/build --output-on-failure

  doc-check:
    name: Doxygen build (no publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y doxygen graphviz

      - name: Configure
        run: cmake -S . -B build -DYSC_MATRIX_BUILD_DOCUMENTATION=ON -DYSC_MATRIX_BUILD_TESTING=OFF

      - name: Build documentation
        run: cmake --build build --target doc
